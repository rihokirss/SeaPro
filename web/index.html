<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + safe-area CSS-is: telefoni "lõuaosa" ei kata ajaliugurit -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0b3550" />
    <meta name="description" content="Mereilm Läänemerel: tuul, lained, mõõtejaamad ja laevad ühel kaardil." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>SeaPro — mereilm</title>
    <!--
      Teema pannakse paika ENNE esimest joonistust.

      Kui seda teeks alles React, näeks kasutaja iga avamise juures hetkeks
      vaiketeemat ja siis vahetust — heleda valinud kasutajale tähendaks see
      pimedas kajutis tumeda ekraani asemel valget välku. Skript on sihilikult
      sünkroonne ja inline: väline fail tähendaks sama vilkumist.
    -->
    <script>
      try {
        var saved = localStorage.getItem('seapro.theme') || 'auto';
        var light =
          saved === 'light' ||
          (saved === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        if (light) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#dfeaf1');
        }
      } catch (e) {
        // Salvestus keelatud või matchMedia puudub — tume on vaikevalik.
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
